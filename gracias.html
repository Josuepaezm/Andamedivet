<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remisión Recibida | Andamedivet</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <style>
        .thankyou-section { height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-light); text-align: center; padding: 20px; }
        .thankyou-card { background: #fff; padding: 50px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); max-width: 600px; }
        .thankyou-icon { font-size: 4rem; color: #28a745; margin-bottom: 20px; }
    </style>
</head>
<body>
    <section class="thankyou-section">
        <div class="thankyou-card">
            <i class="fa-solid fa-circle-check thankyou-icon"></i>
            <h1 style="color: var(--primary-color); margin-bottom: 20px;">¡Remisión Recibida con Éxito!</h1>
            <p style="font-size: 1.1rem; color: var(--text-gray); margin-bottom: 30px;">Estimado colega, hemos recibido los datos de su paciente. Nos pondremos en contacto muy pronto para coordinar la cita y le mantendremos informado sobre los resultados del diagnóstico.</p>
            <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Volver a la Clínica</a>
        </div>
    </section>
</body>
</html>
